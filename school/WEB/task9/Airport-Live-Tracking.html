<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <title>Airport Departure Flights (Live Tracking)</title>
</head>

<body id="body" class="bg-light text-center">
    <div class="container mt-3 mb-3 p-3 bg-white border bordered">

        <h1 class="mt-3">Airport Departure Flights (Live Tracking)</h1>

        <div class="row mt-3 mb-3">
            <div class="col">
                <select class="form-select" id="airport_code">
                    <option disabled selected value="">Select Airport</option>
                    <option value="BAH">Bahrain International Airport (BAH)</option>
                    <option value="DMM">King Fahad Dammam Airport (DMM)</option>
                    <option value="IST">Istanbul Airport (IST)</option>
                    <option value="LHR">London Heathrow Airport (LHR)</option>
                    <option value="CAI">Cairo Airport (CAI)</option>
                </select>
            </div>
            <div class="col">
                <button class="btn btn-primary w-100" onclick="LoadFlights();">Load Flights</button>
            </div>
            <div class="col">
                <button class="btn btn-success w-100" onclick="LoadActiveFlights();">Load Active Flights</button>
            </div>
        </div>

        <label class="fw-bold">Current Date/Time:</label>
        <label id="current_date_time">10:20PM</label>

        <table class="table table-bordered mt-3 table-responsive">
            <thead class="table-dark">
                <tr>
                    <td>Flight Date</td>
                    <td>Flight Status</td>
                    <td>Flight (IATA)</td>
                    <td>Airline</td>
                    <td>Departure Airport</td>
                    <td>Arrival Airport</td>
                    <td>Terminal</td>
                    <td>Scheduled Date & Time</td>
                    <td>Actual Date & Time</td>
                    <td>Live Tracking Link</td>
                </tr>
            </thead>
            <tbody id="flights_body" class="table-light text-center">
                <tr>
                    <td colspan="10">No data yet</td>
                </tr>
            </tbody>
        </table>
    </div>
    <script>
        const API_KEY = "01e736a45d262468694f5e9f1f5ff558"; //while im coding the limit have been reached
        updateCurrentDateTime();
        setInterval(updateCurrentDateTime, 1000);
        async function LoadFlights() {
            const airport_value = document.getElementById("airport_code").value;
            if (!airport_value) {
                Sendmassage("Please select an airport first", 3000, 0);
                return;
            }
            Sendmassage("Loading data...", 3000, 1);
            try {
                let url = `https://api.aviationstack.com/v1/flights?access_key=${API_KEY}&dep_iata=${airport_value}`;
                const response = await fetch(url);
                const data = await response.json();
                if (data == null || data.data == null || data.data.length == 0) {
                    Sendmassage("No data found for this airport", 3000, 0);
                    return;
                }
                build_table(data.data);
            } catch (error) {
                Sendmassage("Error loading flights data", 3000, 0);
            }
        }
        async function LoadActiveFlights() {
            const airport_value = document.getElementById("airport_code").value;
            if (!airport_value) {
                Sendmassage("Please select an airport first", 3000, 0);
                return;
            }
            Sendmassage("Loading data...", 3000, 1);
            try {
                let url = `https://api.aviationstack.com/v1/flights?access_key=${API_KEY}&dep_iata=${airport_value}&flight_status=active`;
                const response = await fetch(url);
                const data = await response.json();
                if (data == null || data.data == null || data.data.length == 0) {
                    Sendmassage("No active flights found for this airport", 3000, 0);
                    return;
                }
                build_table(data.data);
            } catch (error) {
                Sendmassage("Error loading active flights", 3000, 0);
            }
        }
        function build_table(flight_data) {
            const table_body = document.getElementById("flights_body");
            table_body.innerHTML = "";
            for (let i = 0; i < flight_data.length; i++) {
                const flight = flight_data[i];
                const flight_date = flight.flight_date || "N/A";
                const flight_status = flight.flight_status || "N/A";
                const flight_iata = flight.flight?.iata || "N/A";
                const airline_name = flight.airline?.airline_name || "N/A";
                const departure_airport = flight.departure?.airport || "N/A";
                const arrival_airport = flight.arrival?.airport || "N/A";
                const terminal = flight.arrival?.terminal || "N/A";
                const scheduled = flight.arrival?.scheduled || "N/A";
                const actual = flight.arrival?.actual || "N/A";
                let track_link = `<a href="https://www.flightradar24.com/${flight_iata}" target="_blank" class="btn btn-sm btn-info">View</a>`;
                if (flight_iata === "N/A" || flight.live?.is_ground || flight.live == null || flight.live == undefined) track_link = "N/A";

                let row = `<tr>
                            <td>${flight_date}</td>
                            <td>${flight_status}</td>
                            <td>${flight_iata}</td>
                            <td>${airline_name}</td>
                            <td>${departure_airport}</td>
                            <td>${arrival_airport}</td>
                            <td>${terminal}</td>
                            <td>${scheduled}</td>
                            <td>${actual}</td>
                            <td>${track_link}</td>
                        </tr>`;
                table_body.innerHTML += row;
            }

        }
        function updateCurrentDateTime() {
            const dateTimeLabel = document.getElementById("current_date_time");
            const now = new Date();
            dateTimeLabel.textContent = now.toLocaleString();
        }
        function Sendmassage(massage, duration = 3000, type = 2) {
            let alert_class = {
                0: "danger",
                1: "success",
                2: "info"
            }
            let body_element = document.getElementById("body");
            const existingMsg = document.querySelector(".temp-message");
            if (existingMsg) existingMsg.remove();
            let messageDiv = document.createElement("div");
            messageDiv.className = "temp-message rounded position-fixed top-0 end-0";
            messageDiv.style.zIndex = "9999";
            messageDiv.innerHTML = `
        <div class="alert alert-${alert_class[type]} shadow-lg" role="alert">
            <div class="d-flex align-items-center">
                <strong>Status:</strong> 
                <span class="ms-2">${massage}</span>
            </div>
        </div>`;
            body_element.appendChild(messageDiv);
            setTimeout(() => messageDiv.remove(), duration);
        }
    </script>

</body>

</html>
