<!DOCTYPE html>
<html>

<head>
    <title>Simple Flights</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-4">
        <h2 class="text-center">Today's Flights</h2>
        <div id="output"></div>
    </div>
    <script>
        let flight1 = "GF101 - Dubai";
        let flight2 = "EK202 - London";
        let flight3 = "QR330 - Doha";
        document.getElementById("output").innerHTML =
            "<p>" + flight1 + "</p>" +
            "<p>" + flight2 + "</p>" +
            "<p>" + flight3 + "</p>";
    </script>
</body>

</html>
