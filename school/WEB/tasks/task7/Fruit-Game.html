<!DOCTYPE html>
<html>


<head>
    <title>Fruit Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container vh-100 d-flex justify-content-center align-items-center">
        <div class="text-center">

            <div class="row justify-content-center mb-4">
                <div class="col-auto">
                    <img src="images/Apple.png" alt="img1" id="img1" width="120">
                </div>
                <div class="col-auto">
                    <img src="images/banana.png" alt="img2" id="img2" width="120">
                </div>
                <div class="col-auto">
                    <img src="images/orange.jpg" alt="img3" id="img3" width="120">
                </div>
                <div class="col-auto">
                    <img src="images/carrots.png" alt="img4" id="img4" width="120">
                </div>
                <div class="col-auto">
                    <img src="images/strawberry.png" alt="img5" id="img5" width="120">
                </div>
            </div>

            <form>
                <div class="mb-3">
                    <label>Speed Level:</label><br>

                    <input name="speed" type="radio" id="easy" value="1000" checked> Easy
                    <input name="speed" type="radio" id="medium" value="500"> Medium
                    <input name="speed" type="radio" id="hard" value="250"> Hard
                </div>

                <div class="mb-4">
                    <input type="button" onclick="startGame()" id="START" value="Start Game" class="btn btn-success">
                    <input type="button" onclick="stopSpinning()" id="Stop" value="Stop Spinning" class="btn btn-danger"
                        disabled>
                </div>

                <div class="row justify-content-center">
                    <div class="col-4">
                        <h3>Wins</h3>
                        <h1 id="wins">0</h1>
                    </div>
                    <div class="col-4">
                        <h3>Losts</h3>
                        <h1 id="losts">0</h1>
                    </div>
                </div>
            </form>

        </div>
    </div>
    <script>
        const images = ["images/Apple.png", "images/banana.png", "images/orange.jpg", "images/carrots.png", "images/strawberry.png"];
        const imgGetId = [document.getElementById("img1"), document.getElementById("img2"), document.getElementById("img3"), document.getElementById("img4"), document.getElementById("img5")];
        const img = ["img1", "img2", "img3", "img4", "img5"];
        const wins = document.getElementById("wins");
        const losts = document.getElementById("losts");
        let gameInterval = null;
        function getSpeed() {
            if (document.getElementById("easy").checked) {
                return 1000;
            } else if (document.getElementById("medium").checked) {
                return 500;
            } else if (document.getElementById("hard").checked) {
                return 250;
            } else {
                return 1000;
            }
        }
        function startGame() {
            const speed = getSpeed();
            document.getElementById("START").disabled = true;
            document.getElementById("Stop").disabled = false;
            gameInterval = setInterval(changePicture, speed);
            if (gameInterval !== null) {
                changePicture();
            }
        }
        function randomNumber(max_number) {
            return Math.floor(Math.random() * max_number);
        }
        function changePicture() {
            for (let i = 0; i < img.length; i++) {
                document.getElementById(img[i]).src = images[randomNumber(images.length)];
            }
        }
        function stopSpinning() {
            document.getElementById("START").disabled = false;
            document.getElementById("Stop").disabled = true;
            clearInterval(gameInterval);
            gameInterval = null;
            if (imgGetId[0].src === imgGetId[1].src && imgGetId[1].src === imgGetId[2].src && imgGetId[2].src === imgGetId[3].src && imgGetId[3].src === imgGetId[4].src) {
                wins.innerText = parseInt(wins.innerText) + 1;
            } else {
                losts.innerText = parseInt(losts.innerText) + 1;
            }
        }
    </script>
</body>

</html>
