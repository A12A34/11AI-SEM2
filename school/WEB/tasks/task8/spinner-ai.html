<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Game</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        .fruit-icon {
            width: 72px;
            height: 72px;
            object-fit: contain;
        }
    </style>

</head>

<body>

    <div class="container text-center py-4">

        <div class="d-flex justify-content-center gap-4">

            <img src="apple.webp" id="img1" class="fruit-icon">
            <img src="banana.webp" id="img2" class="fruit-icon">
            <img src="orange.webp" id="img3" class="fruit-icon">

        </div>

        <div class="mt-2">

            <div class="form-check form-check-inline d-flex justify-content-center gap-3">
                <div class="col-4">
                    <input class="form-check-input" type="radio" name="level" id="easy" checked>
                    <label class="form-check-label small">Easy</label>
                </div>
                <div class="col-4">
                    <input class="form-check-input" type="radio" name="level" id="medium">
                    <label class="form-check-label small">Medium</label>
                </div>
                <div class="col-4">
                    <input class="form-check-input" type="radio" name="level" id="hard">
                    <label class="form-check-label small">Hard</label>
                </div>
            </div>
        </div>
    </div>

    </div>

    <div class="mt-2 d-flex justify-content-center gap-3">

        <button id="startgame" class="btn btn-primary" onclick="startGame()">Start Game</button>

        <button id="stop" class="btn btn-danger" onclick="stopGame()" disabled>Stop Spinning</button>

    </div>

    <div class="mt-4 d-flex justify-content-center gap-5">

        <div>
            <div class="fw-bold">Wins</div>
            <div id="wins" class="h4 mb-0">0</div>
        </div>

        <div>
            <div class="fw-bold">Losses</div>
            <div id="losses" class="h4 mb-0">0</div>
        </div>

    </div>

    </div>

    <script>
        var images = [
            "apple.webp",
            "banana.webp",
            "orange.webp"
        ];
        wins = 0;
        losses = 0;
        img1 = document.getElementById("img1");
        img2 = document.getElementById("img2");
        img3 = document.getElementById("img3");

        img1.src = images[0];
        img2.src = images[1];
        img3.src = images[2];

        var gameInterval;
        function getRandomImage() {
            return images[Math.floor(Math.random() * images.length)];
        }

        function startGame() {
            document.getElementById("startgame").disabled = true;
            document.getElementById("stop").disabled = false;
            if (document.getElementById("easy").checked) {
                gameInterval = setInterval(changePicture, 1000);
            } else if (document.getElementById("medium").checked) {
                gameInterval = setInterval(changePicture, 500);
            } else if (document.getElementById("hard").checked) {
                gameInterval = setInterval(changePicture, 250);
            }
        }
        function changePicture() {
            img1.src = getRandomImage();
            img2.src = getRandomImage();
            img3.src = getRandomImage();

        }

        function stopGame() {
            document.getElementById("startgame").disabled = false;
            document.getElementById("stop").disabled = true;
            clearInterval(gameInterval);
            if (img1.src === img2.src && img2.src === img3.src) {
                alert("You win!");
                wins++;
            } else {
                alert("You lose!");
                losses++;
            }
            document.getElementById("wins").innerHTML = wins;
            document.getElementById("losses").innerHTML = losses;
        }
    </script>

</body>

</html>
