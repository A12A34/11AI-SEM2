<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

<body class="bg-light text-center">
    <div class="container mt-3 p-3 bg-white border bordered">
        <h1>Airport Flight Screen</h1>
        <div class="row">
            <div class="col">
                <select id="select-flight" class="form-select mb-3">
                    <option value="0">Select Flight</option>
                    <option value="1">bahrain Airport</option>
                    <option value="2">king fahad dammam Airport</option>
                </select>
            </div>
            <div class="col">
                <button id="show" onclick="load_flights()" class="btn btn-primary mb-3 w-100">Show Flight
                    Details</button>
            </div>

        </div>
        <div class="row">
            <label class="fw-bold">current date/ time:</label>
            <label>10:20PM</label>
        </div>
        <row>
            <table class="table table-bordered table-dark">
                <thead>
                    <tr>
                        <th>Flight Date</th>
                        <th>Flight Status</th>
                        <th>Flight (IATA)</th>
                        <th>Airline</th>
                        <th>Departure Airport</th>
                        <th>Terminal</th>
                        <th>Scheduled Date & Time</th>
                        <th>Estimated Date & Time</th>
                        <th>Actual Date & Time</th>
                        <th>Delay in Minutes</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </row>
    </div>
    <script>
        function load_flights() {
            let select_airport = document.getElementById("select-flight");
            let Airport_value = select_airport.value;
            console.log(Airport_value);
        }
    </script>
</body>

</html>
