<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="container container-fluid ">
        <form>
            <h1 class="text-center">Login</h1>
            <p class="text-center">Please enter your credentials below:</p>
            <div class="border border-2 container bg-light rounded p-3">
                <div class="row">
                    <div class="col-6">
                        <label class="form-label">enter first name:</label>
                        <input type="text" class="form-control" placeholder="First Name">
                    </div>
                    <div class="col-6">
                        <label class="form-label">enter last name:</label>
                        <input type="text" class="form-control" placeholder="Last Name">
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-12">
                        <label class="form-label">enter email:</label>
                        <input type="email" class="form-control" placeholder="Email">
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-12">
                        <label class="form-label">Grade:</label>
                        <select class="form-control">
                            <option value="">Select Grade</option>
                            <option value="1">Grade 1</option>
                            <option value="2">Grade 2</option>
                            <option value="3">Grade 3</option>
                        </select>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-12">
                        <input type="checkbox" class="form-check-input">
                        <label class="form-label">I agree to the terms and conditions</label>
                    </div>
                    <div class="row">
                        <div class="col-12 mt-3">
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </div>
                    </div>
                </div>
        </form>
    </div>
</body>

</html>
