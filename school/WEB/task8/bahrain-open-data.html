<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number of trainees by year</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body id="body">
    <div class="container container-fluid text-center align-items-center gap-2">
        <div class="row">
            <h1>Number of trainees by year</h1>
        </div>
        <div class="row">
            <button class="btn btn-primary col-2 w-100" onclick="load_data()">Load data</button>
        </div>
        <div class="row">
            <table class="table table-bordered table-hover mt-3">
                <thead class="table-dark table-striped">
                    <tr>
                        <th>#</th>
                        <th>Year</th>
                        <th>Number of trainees</th>
                    </tr>
                </thead>
                <tbody id="data-table-body">
                    <tr>
                        <td colspan="3">data didnt load yet</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        const api_url = "https://www.data.gov.bh/api/explore/v2.1/catalog/datasets/01_number-of-trainees-by-year-physically-attend/records?limit=20"
        setInterval(load_data, 60000);
        async function load_data() {
            Sendmassage("Loading data...", 0, 2);
            try {
                const response = await fetch(api_url);
                const data = await response.json();
                Sendmassage("Data loaded successfully", 3000, 1);
                build_table(data);
            } catch (error) {
                Sendmassage("Error loading data", 3000, 0);
            }
        }
        function build_table(data) {
            let table_body = document.getElementById("data-table-body");
            table_body.innerHTML = "";
            let row_number = 0;
            for (let record of data.results) {
                row_number++;
                if (record.year == null || record.year == undefined || record.year == "") record.year = "N/A";
                if (record.number == null || record.number == undefined || record.number == "") record.number = "N/A";
                table_body.innerHTML += `
                <tr>
                    <td>${row_number}</td>
                    <td>${record.year}</td>
                    <td>${record.number}</td>
                </tr>
                `;
            };
        }
        function Sendmassage(massage, duration = 3000, type = 2) {
            let alert_class = {
                0: "danger",
                1: "success",
                2: "info"
            }
            let body_element = document.getElementById("body");
            const existingMsg = document.querySelector(".temp-message");
            if (existingMsg) existingMsg.remove();
            let messageDiv = document.createElement("div");
            messageDiv.className = "temp-message rounded position-fixed top-0 end-0";
            messageDiv.style.zIndex = "9999";
            messageDiv.innerHTML = `
        <div class="alert alert-${alert_class[type]} shadow-lg" role="alert">
            <div class="d-flex align-items-center">
                <strong>Status:</strong> 
                <span class="ms-2">${massage}</span>
            </div>
        </div>`;
            body_element.appendChild(messageDiv);
            setTimeout(() => messageDiv.remove(), duration);
        }
    </script>
</body>

</html>
