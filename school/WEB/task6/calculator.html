<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap Calculator UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-light">
    <main class="container py-5">
        <div class="mx-auto calc card shadow-sm">
            <div class="card-body p-3">
                <!-- Display -->
                <input id="display" class="form-control calc-display mb-3" type="text" value="0" readonly />
                <!-- Buttons -->
                <div class="d-grid gap-2">
                    <div class="row g-2">
                        <div class="col-9">
                            <button onclick="clear_display()" class="btn btn-danger w-100" data-action="clear">C</button>
                        </div>
                        <div class="col">
                            <button onclick="number_to_display('/')" class="btn btn-warning w-100" data-op="divide">÷</button>
                        </div>
                    </div>

                    <div class="row g-2">
                        <div class="col-3"><button onclick="number_to_display('7')" class="btn btn-light w-100" data-num="7">7</button></div>
                        <div class="col-3"><button onclick="number_to_display('8')" class="btn btn-light w-100" data-num="8">8</button></div>
                        <div class="col-3"><button onclick="number_to_display('9')" class="btn btn-light w-100" data-num="9">9</button></div>
                        <div class="col-3"><button onclick="number_to_display('*')" class="btn btn-warning w-100" data-op="multiply">×</button></div>
                    </div>
                    <div class="row g-2">
                        <div class="col-3"><button onclick="number_to_display('4')" class="btn btn-light w-100" data-num="4">4</button></div>
                        <div class="col-3"><button onclick="number_to_display('5')" class="btn btn-light w-100" data-num="5">5</button></div>
                        <div class="col-3"><button onclick="number_to_display('6')" class="btn btn-light w-100" data-num="6">6</button></div>
                        <div class="col-3"><button onclick="number_to_display('-')" class="btn btn-warning w-100" data-op="minus">−</button></div>
                    </div>

                    <div class="row g-2">
                        <div class="col-3"><button onclick="number_to_display('1')" class="btn btn-light w-100" data-num="1">1</button></div>
                        <div class="col-3"><button onclick="number_to_display('2')" class="btn btn-light w-100" data-num="2">2</button></div>
                        <div class="col-3"><button onclick="number_to_display('3')" class="btn btn-light w-100" data-num="3">3</button></div>
                        <div class="col-3"><button onclick="number_to_display('+')" class="btn btn-warning w-100" data-op="plus">+</button></div>
                    </div>

                    <div class="row g-2">
                        <div class="col-6">
                            <button onclick="number_to_display('0')" class="btn btn-light w-100" data-num="0">0</button>
                        </div>
                        <div class="col-3">
                            <button onclick="number_to_display('.')" class="btn btn-light w-100" data-num=".">.</button>
                        </div>
                        <div class="col-3">
                            <button onclick="calculate()" class="btn btn-success w-100" data-action="equals">=</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

<script>
    // Write your JS Code here..
    let display_value = document.getElementById('display').value;
    function number_to_display(value) {
        if (display_value === '0') {
            display_value = value;
        } else {
            display_value += value;
        }
        document.getElementById('display').value = display_value;
    }
    function clear_display() {
        display_value = '0';
        document.getElementById('display').value = display_value;
    }
    function calculate() {
        display_value = eval(display_value).toString();
        document.getElementById('display').value = display_value;
    }
</script>

</html>
